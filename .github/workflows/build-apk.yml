name: Build Production APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Entorno (Package y Config a prueba de fallos)
        run: |
          cat << 'EOF' > package.json
          {
            "name": "nuestra-boda",
            "version": "1.0.0",
            "dependencies": {
              "@capacitor/core": "^5.0.0",
              "@capacitor/android": "^5.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^5.0.0",
              "@capacitor/assets": "^3.0.5"
            }
          }
          EOF
          
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.nuestraboda.app",
            "appName": "Nuestra Boda",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF
          npm install

      - name: Incluir librerías dentro del APK (funciona sin internet)
        run: |
          npm install --no-save chart.js@4.4.4 sortablejs@1.15.3
          mkdir -p www/lib
          cp node_modules/chart.js/dist/chart.umd.js www/lib/chart.umd.js
          cp node_modules/sortablejs/Sortable.min.js www/lib/Sortable.min.js

      - name: Crear Ícono de Boda (Anillos y Diamante Nativos)
        run: |
          mkdir -p assets
          cat << 'EOF' > assets/icon.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
            <rect width="1024" height="1024" fill="#FDF6F0"/>
            <!-- Anillo Oro -->
            <circle cx="400" cy="550" r="220" fill="none" stroke="#D4A373" stroke-width="60" />
            <!-- Anillo Lila -->
            <circle cx="600" cy="450" r="220" fill="none" stroke="#C5A3C7" stroke-width="60" />
            <!-- Diamante -->
            <polygon points="600,160 550,110 650,110" fill="#9FB8D0"/>
            <polygon points="600,160 550,110 520,160" fill="#E8F0F6"/>
            <polygon points="600,160 650,110 680,160" fill="#E8F0F6"/>
            <polygon points="600,230 520,160 600,160" fill="#FFFFFF"/>
            <polygon points="600,230 680,160 600,160" fill="#F4F7F8"/>
          </svg>
          EOF
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1024 -h 1024 assets/icon.svg -o assets/icon.png
          cp assets/icon.png assets/splash.png

      - name: Generar Proyecto Nativo e Incrustar Íconos
        run: |
          rm -rf android
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Compilar APK Final (Firma Automática de Sistema)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Preparar Archivo Limpio (Quitar etiqueta debug)
        run: |
          mkdir -p final-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk final-apk/NuestraBoda.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: NuestraBoda-App
          path: final-apk/NuestraBoda.apk
