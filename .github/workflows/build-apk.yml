name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Valid package.json & Install
        run: |
          # Creamos un package.json limpio y válido con todas las dependencias nativas requeridas
          cat << 'EOF' > package.json
          {
            "name": "nuestra-boda",
            "version": "1.0.0",
            "description": "App de planificacion de bodas",
            "main": "index.js",
            "scripts": {
              "test": "echo \"Error: no test specified\" && exit 1"
            },
            "dependencies": {
              "@capacitor/core": "^5.0.0",
              "@capacitor/android": "^5.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^5.0.0"
            }
          }
          EOF
          npm install

      - name: Setup Capacitor Android & Sync
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare Artifact
        run: |
          mkdir -p final-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk final-apk/NuestraBoda-Final.apk

      - name: Upload Clean APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuestraBoda-Final-APK
          path: final-apk/NuestraBoda-Final.apk
