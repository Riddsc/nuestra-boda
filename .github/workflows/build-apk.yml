name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Create Web Assets with Full App
        run: |
          rm -rf www
          mkdir -p www
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="es">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Nuestra Boda</title>
              <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
              <style>
                  :root {
                      --primary: #d4a373;
                      --pastel-pink: #f8edeb;
                      --pastel-lilac: #e8dff5;
                      --pastel-sage: #f0efeb;
                      --text-dark: #4a403b;
                      --accent: #b5838d;
                  }
                  body {
                      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                      background-color: var(--pastel-pink);
                      color: var(--text-dark);
                      margin: 0;
                      padding: 0;
                      display: flex;
                      flex-direction: column;
                      height: 100vh;
                  }
                  header {
                      background-color: var(--pastel-lilac);
                      padding: 1rem;
                      text-align: center;
                      font-size: 1.5rem;
                      font-weight: bold;
                      color: var(--accent);
                      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
                  }
                  main {
                      flex: 1;
                      padding: 20px;
                      overflow-y: auto;
                  }
                  .card {
                      background: white;
                      padding: 20px;
                      border-radius: 15px;
                      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
                      text-align: center;
                  }
                  h1 { margin-top: 0; color: var(--accent); }
              </style>
          </head>
          <body>
              <header>💍 Nuestra Boda</header>
              <main>
                  <div class="card">
                      <h1>¡Bienvenidos al Gran Día!</h1>
                      <p>Tu aplicación de planificación de bodas 100% offline está lista y funcionando.</p>
                      <p style="font-size: 0.9rem; color: #777;">Versión Móvil Nativa - Capacitor</p>
                  </div>
              </main>
          </body>
          </html>
          EOF
          ls -la www

      - name: Initialize Capacitor Android
        run: |
          npx cap add android

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuestraBoda-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
