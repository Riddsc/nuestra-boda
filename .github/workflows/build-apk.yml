name: Build Production APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Initialize Capacitor Android & Sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename and Prepare Artifact
        run: |
          mkdir -p final-apk
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk final-apk/NuestraBoda-Final.apk

      - name: Upload Clean APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuestraBoda-Final-APK
          path: final-apk/NuestraBoda-Final.apk
